name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pytest
      - run: python -m pytest -q python/tests
        env: {CCUSB_LIBRARY: "${{ github.workspace }}/build/libccusb.so"}

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install libusb pkg-config
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pytest
      - run: python -m pytest -q python/tests
        env: {CCUSB_LIBRARY: "${{ github.workspace }}/build/libccusb.dylib"}

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: libusb (vcpkg)
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libusb:x64-windows
          "LIBUSB_ROOT=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows" >> $env:GITHUB_ENV
      - run: cmake -S . -B build -DLIBUSB_ROOT="$env:LIBUSB_ROOT"
        shell: pwsh
      - run: cmake --build build --config Release
      - name: bundle runtime
        shell: pwsh
        run: |
          Copy-Item "$env:LIBUSB_ROOT\bin\libusb-1.0.dll" build\Release\
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build\Release\*.dll, build\Release\ccusb.exe, README.md dist\
      - run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pytest
      - run: python -m pytest -q python/tests
        env: {CCUSB_LIBRARY: "${{ github.workspace }}\\build\\Release\\ccusb.dll"}
      - uses: actions/upload-artifact@v4
        with:
          name: ccusb-windows-x64
          path: dist
